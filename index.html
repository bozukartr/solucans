<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03151c" />
    <meta
      name="description"
      content="Işıkyılan — derin sularda büyü, rakiplerinden kaç ve zirveye çık."
    />
    <title>Işıkyılan</title>
  </head>
  <body data-screen="menu">
    <div id="app">
      <div id="game-root" aria-hidden="true"></div>
      <div class="game-vignette" aria-hidden="true"></div>

      <main class="screen menu-screen" id="menu-screen">
        <section class="menu-card" aria-labelledby="game-title">
          <p class="eyebrow">DERİN SU ARENASI</p>
          <h1 id="game-title">Işık<span>yılan</span></h1>
          <p class="menu-copy">Büyü, çevik kal ve sürünün zirvesine çık.</p>

          <form id="play-form" class="play-form">
            <label for="player-name">Oyuncu adı</label>
            <input
              id="player-name"
              name="playerName"
              type="text"
              maxlength="12"
              placeholder="Adını yaz"
              autocomplete="nickname"
              enterkeyhint="go"
            />
            <button class="primary-button" type="submit">
              <span>Oyuna başla</span>
              <span aria-hidden="true">→</span>
            </button>
          </form>

          <div class="quick-guide" aria-label="Nasıl oynanır">
            <span><b>01</b> Yön ver</span>
            <span><b>02</b> Işıkları topla</span>
            <span><b>03</b> Çarpışma</span>
          </div>

          <p class="desktop-hint">
            Fareyle yön ver · Sol tık veya <kbd>boşluk</kbd> ile hızlan
          </p>
        </section>
      </main>

      <section class="hud" id="hud" aria-label="Oyun bilgileri">
        <div class="score-card">
          <span>UZUNLUK</span>
          <strong id="length-value">0</strong>
        </div>

        <div class="leaderboard-card">
          <p>SIRALAMA</p>
          <div id="leaderboard"></div>
        </div>

        <canvas id="minimap" class="minimap" aria-label="Arena haritası"></canvas>
      </section>

      <button class="boost-button" id="boost-button" type="button">
        <span aria-hidden="true">⚡</span>
        Hızlan
      </button>

      <section class="screen game-over-screen" id="game-over-screen" hidden>
        <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
          <p class="eyebrow danger">OYUN BİTTİ</p>
          <h2 id="result-title">Yakalandın</h2>
          <p class="result-message" id="result-message">Bir yılana çarptın.</p>

          <div class="result-stats">
            <div><span>Uzunluk</span><strong id="final-length">0</strong></div>
            <div><span>Sıra</span><strong id="final-rank">-</strong></div>
            <div><span>Toplanan</span><strong id="final-eaten">0</strong></div>
          </div>

          <button class="primary-button" id="retry-button" type="button">
            <span>Tekrar oyna</span>
            <span aria-hidden="true">↻</span>
          </button>
          <button class="text-button" id="menu-button" type="button">Ana menü</button>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
